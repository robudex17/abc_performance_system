name: Frontend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get short commit SHA
        id: sha
        run: echo "SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            robudex17/frontend-performance-abc:${{ steps.sha.outputs.SHORT_SHA }}
            robudex17/frontend-performance-abc:latest

      - name: Checkout config repo
        uses: actions/checkout@v4
        with:
          repository: robudex17/abc_performance_config
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: config-repo

      - name: Update frontend image tag in config repo
        run: |
          cd config-repo
          sed -i "s|robudex17/frontend-performance-abc:.*|robudex17/frontend-performance-abc:${{ steps.sha.outputs.SHORT_SHA }}|g" frontend/deployment.yaml
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add frontend/deployment.yaml
          git commit -m "update frontend image tag to ${{ steps.sha.outputs.SHORT_SHA }}"
          git push